name: Windows build and regression checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build LocalhostManager/LocalhostManager.csproj -c Release
      - run: dotnet run --project LocalhostManager.Tests/LocalhostManager.Tests.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-previews
          path: artifacts/screenshots/
